[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "toc-engine"
version = "0.1.0"
description = "Goal-first Theory of Constraints engine: measure your pipeline, find the constraint, run the improvement loop"
requires-python = ">=3.13"
license = { text = "MIT" }

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
toc = "toc_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
